name: Publish Asteriq worker container

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Make the already-built worker image publicly pullable
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: asteriqstudio-worker
        run: |
          gh api --method PATCH "orgs/${OWNER}/packages/container/${PACKAGE}" -f visibility=public
          gh api "orgs/${OWNER}/packages/container/${PACKAGE}" --jq '{name, visibility, version_count}'
