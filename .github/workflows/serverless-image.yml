name: Build Asteriq Serverless image

on:
  push:
    branches: [development]
    paths:
      - 'runpod/**'
      - '.dockerignore'
      - '.github/workflows/serverless-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/asteriqstudio/asteriqstudio-worker

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The ComfyUI base image is large.  GitHub-hosted runners reserve much
      # of their disk for SDKs that this image build never uses, so reclaim it
      # before Buildx writes layers.  This touches only the temporary runner.
      - name: Free runner disk for the GPU worker image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo docker system prune --all --force --volumes
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: runpod/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:development
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
